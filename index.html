<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Orbital Dodge</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;
 overscroll-behavior:none;background:#090b16;color:#f5f6ff;
 font-family:system-ui,-apple-system,sans-serif;
}
body{display:flex;align-items:center;justify-content:center;padding:6px}

#game{
 width:min(100%,calc(100dvh - 92px),500px);
 max-height:100%;
 display:flex;flex-direction:column;gap:7px;
 text-align:center;
}

#arena{position:relative;width:100%;flex-shrink:1;min-height:0}

canvas{
 width:100%;height:auto;aspect-ratio:1/1;display:block;
 border:1px solid #2a2f4a;border-radius:14px;
 background:#090b16;touch-action:none;
}

/* ---------- in-arena HUD ---------- */
.hud{
 position:absolute;left:14px;right:14px;z-index:2;
 display:flex;align-items:center;
 pointer-events:none;
 text-shadow:0 1px 6px #090b16;
}
.hud-top{
 top:10px;
 display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
}
.hud-item{
 font-size:clamp(9px,2.7vw,11px);letter-spacing:1.2px;
 color:#b9c0d8;white-space:nowrap;
}
.hud-item:first-child{justify-self:start}
.hud-item:last-child{justify-self:end}
.hud-item b{color:#fff;font-weight:700;margin-left:4px}
#hud-title{
 text-align:center;white-space:nowrap;
 font-size:clamp(13px,3.8vw,17px);
 font-weight:800;letter-spacing:2.5px;color:#fff;
}
#hud-title span{color:#ff7043}

.hud-bottom{
 bottom:12px;
 justify-content:space-between;
 gap:10px;
}
.lives-group{display:flex;align-items:center;gap:10px}
.lives-label{
 font-size:clamp(9px,2.7vw,11px);letter-spacing:1.6px;color:#e6e9f7;
}
#lives-pips{display:flex;align-items:center;gap:7px}
.pip{
 display:block;width:16px;height:16px;border-radius:50%;
 background:#252a40;
 transition:background .15s,box-shadow .15s;
}
.pip.on{
 background:#38b6ff;
 box-shadow:0 0 10px rgba(56,182,255,.9);
}
#fps{
 font-size:clamp(9px,2.5vw,10px);
 letter-spacing:1.1px;
 color:#858ba9;
 white-space:nowrap;
}

/* ---------- divider ---------- */
#divider{
 height:2px;margin:0 2px;border-radius:2px;flex-shrink:0;
 background:#8a5cf6;
 box-shadow:0 0 10px rgba(138,92,246,.85);
}

/* ---------- controls ---------- */
.controls{
 display:flex;justify-content:center;align-items:center;gap:9px;
 flex-shrink:0;
}
button,select{
 font:inherit;font-size:12px;
 border:1px solid #414966;border-radius:9px;
 background:#1b2035;color:#fff;
 padding:8px 12px;
}
button{cursor:pointer;touch-action:manipulation}
select{cursor:pointer}
#start{
 background:#ff7043;border-color:#ff7043;color:#160b07;
 font-weight:800;letter-spacing:.4px;padding:9px 18px;
}

#message{
 min-height:14px;flex-shrink:0;
 font-size:10px;color:#8a90ab;
 display:flex;align-items:center;justify-content:center;
}

@media(max-height:560px){
 #game{width:min(84vw,calc(100dvh - 80px),440px);gap:5px}
 .hud-top{top:7px}
 .hud-bottom{bottom:8px}
 button,select{padding:6px 9px;font-size:11px}
 #start{padding:7px 13px}
 #message{min-height:10px;font-size:9px}
 .pip{width:13px;height:13px}
}
</style>
</head>
<body>
<div id="game">

 <div id="arena">
  <canvas id="canvas" width="600" height="600"
    aria-label="Orbital Dodge gameplay"></canvas>

  <div class="hud hud-top">
   <div class="hud-item">SCORE <b id="hud-score">0</b></div>
   <div id="hud-title">ORBITAL <span>DODGE</span></div>
   <div class="hud-item">BEST <b id="hud-best">0</b></div>
  </div>

  <div class="hud hud-bottom">
   <div class="lives-group">
    <span class="lives-label">LIVES</span>
    <div id="lives-pips"></div>
   </div>
   <span id="fps">FPS --</span>
  </div>
 </div>

 <div id="divider"></div>

 <div class="controls">
  <select id="difficulty" aria-label="Difficulty">
   <option value="easy">EASY</option>
   <option value="medium" selected>MEDIUM</option>
   <option value="hard">HARD</option>
  </select>
  <button id="start">START GAME</button>
 </div>

 <div id="message">Avoid the red hazards.</div>
</div>

<script>
(()=>{
"use strict";

const $=id=>document.getElementById(id);
const canvas=$("canvas"),ctx=canvas.getContext("2d");
const W=600,H=600,cx=300,cy=300,orbit=145;
const MAX_LIVES=5;

const modes={
 easy:{speed:75,interval:1.5,bonusInterval:7,turn:1.6},
 medium:{speed:115,interval:.95,bonusInterval:5.5,turn:2},
 hard:{speed:155,interval:.62,bonusInterval:4.2,turn:2.5}
};

let best=0;
try{best=Math.max(0,Number(localStorage.getItem("orbitalDodgeBest"))||0)}catch(e){}

/* Start with one life. */
let running=false,score=0,lives=1,angle=-Math.PI/2,dir=1;
let elapsed=0,last=0,spawn=0,bonusSpawn=0;
let hazards=[],bonuses=[],particles=[],flash=0,mode=modes.medium;
let rafId=null;

/* FPS tracking */
let fps=0,fpsTimer=0,fpsFrames=0;

/* ---- lives pips ---- */
const pips=[];
for(let i=0;i<MAX_LIVES;i++){
 const p=document.createElement("i");
 p.className="pip";
 $("lives-pips").appendChild(p);
 pips.push(p);
}

const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(x,y,a,b)=>Math.hypot(x-a,y-b);

function player(){
 return {x:cx+Math.cos(angle)*orbit,y:cy+Math.sin(angle)*orbit};
}

// The player grows with every extra life beyond the first.
function playerRadius(){return 8+(lives-1)*2.4}
function playerColor(){return lives>=2?"#43baff":"#ff713e"}

function hud(){
 $("hud-score").textContent=score;
 $("hud-best").textContent=best;
 pips.forEach((p,i)=>p.classList.toggle("on",i<lives));
}

function burst(x,y,color){
 for(let i=0;i<14;i++){
  const a=rnd(0,Math.PI*2),v=rnd(35,150);
  particles.push({
   x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
   life:.55,color
  });
 }
}

function spawnHazard(){
 // Random edge entry, directed across the arena.
 const side=Math.floor(Math.random()*4);
 let x,y;
 if(side===0){x=rnd(0,W);y=-15}
 else if(side===1){x=W+15;y=rnd(0,H)}
 else if(side===2){x=rnd(0,W);y=H+15}
 else{x=-15;y=rnd(0,H)}

 const dx=cx-x,dy=cy-y;
 const base=Math.atan2(dy,dx)+rnd(-.5,.5);
 const speed=mode.speed+Math.min(elapsed*2.5,110);

 hazards.push({
  x,y,vx:Math.cos(base)*speed,vy:Math.sin(base)*speed,
  r:rnd(7,11),dead:false
 });
}

function spawnBonus(){
 const a=rnd(0,Math.PI*2);
 const x=cx+Math.cos(a)*350,y=cy+Math.sin(a)*350;
 const d=Math.hypot(cx-x,cy-y)||1;
 bonuses.push({
  x,y,vx:(cx-x)/d*mode.speed*.85,
  vy:(cy-y)/d*mode.speed*.85,r:9,dead:false
 });
}

function start(){
 if(rafId!==null){
  cancelAnimationFrame(rafId);
  rafId=null;
 }

 mode=modes[$("difficulty").value];
 running=true;score=0;lives=1;
 angle=-Math.PI/2;dir=1;elapsed=0;
 spawn=.3;bonusSpawn=2;
 hazards=[];bonuses=[];particles=[];flash=0;
 last=performance.now();
 fps=0;fpsTimer=0;fpsFrames=0;
 $("fps").textContent="FPS --";
 $("message").textContent="One life: orange. Two or more: blue!";
 $("start").textContent="RESTART";
 hud();
 rafId=requestAnimationFrame(loop);
}

function end(){
 running=false;
 if(score>best){
  best=score;
  try{localStorage.setItem("orbitalDodgeBest",String(best))}catch(e){}
 }
 hud();
 $("message").textContent=`GAME OVER · SCORE ${score} · BEST ${best}`;
 $("start").textContent="PLAY AGAIN";
}

function dodge(){
 if(running)dir*=-1;
}

window.addEventListener("keydown",e=>{
 if(e.key==="Escape")return;
 if(e.repeat)return;
 if(running){
  e.preventDefault();
  dodge();
 }else if(e.key==="Enter"||e.key===" "){
  e.preventDefault();
  start();
 }
});

canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 dodge();
});

$("start").addEventListener("click",start);

function drawBall(b,color,glow){
 ctx.save();
 ctx.shadowColor=color;ctx.shadowBlur=glow;
 ctx.fillStyle=color;
 ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);

 // Background stars.
 for(let i=0;i<70;i++){
  const x=(i*137.5+23)%W,y=(i*89.3+11)%H;
  ctx.fillStyle="rgba(170,190,255,.23)";
  ctx.fillRect(x,y,2,2);
 }

 // Orbit track and central marker.
 ctx.beginPath();ctx.arc(cx,cy,orbit,0,Math.PI*2);
 ctx.strokeStyle="#3a3f5e";ctx.lineWidth=2;ctx.stroke();

 ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);
 ctx.fillStyle="#62698b";ctx.fill();

 hazards.forEach(b=>drawBall(b,"#ff414d",12));
 bonuses.forEach(b=>drawBall(b,"#bd72ff",20));

 // Player, colored according to current lives.
 const p=player(),r=playerRadius(),c=playerColor();
 ctx.save();ctx.shadowColor=c;ctx.shadowBlur=22;
 ctx.fillStyle=c;
 ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
 ctx.restore();

 ctx.beginPath();ctx.arc(p.x,p.y,r+5,0,Math.PI*2);
 ctx.strokeStyle=c+"77";ctx.lineWidth=2;ctx.stroke();

 particles.forEach(pt=>{
  ctx.globalAlpha=Math.max(0,pt.life*2);
  ctx.fillStyle=pt.color;
  ctx.beginPath();ctx.arc(pt.x,pt.y,2.5,0,Math.PI*2);ctx.fill();
 });
 ctx.globalAlpha=1;

 if(flash>0){
  ctx.fillStyle=`rgba(255,40,60,${flash*.2})`;
  ctx.fillRect(0,0,W,H);
 }
}

function loop(now){
 if(!running){draw();return}

 const dt=Math.min((now-last)/1000,.035);
 last=now;elapsed+=dt;

 // FPS counter
 fpsTimer+=dt;fpsFrames++;
 if(fpsTimer>=0.5){
  fps=Math.round(fpsFrames/fpsTimer);
  fpsTimer=0;fpsFrames=0;
  $("fps").textContent="FPS "+fps;
 }

 // One point per second.
 score=Math.floor(elapsed);
 flash=Math.max(0,flash-dt*3);

 // Player moves at 0.4× the previous orbit speed.
 angle+=dir*mode.turn*.65*.4*dt;

 spawn-=dt;
 if(spawn<=0){
  spawnHazard();
  spawn=Math.max(.24,mode.interval-elapsed*.003);
 }

 // Purple bonus orbs appear only after reaching 20 points.
 if(score>=20){
  bonusSpawn-=dt;
  if(bonusSpawn<=0){
   spawnBonus();
   bonusSpawn=mode.bonusInterval;
  }
 }

 const p=player(),r=playerRadius();

 hazards.forEach(b=>{
  b.x+=b.vx*dt;
  b.y+=b.vy*dt;

  if(!b.dead&&dist(b.x,b.y,p.x,p.y)<b.r+r){
   b.dead=true;lives--;flash=1;
   burst(p.x,p.y,"#ff414d");

   if(lives<=0){
    lives=0;
    end();
   }
  }

  if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40)b.dead=true;
 });

 bonuses.forEach(b=>{
  b.x+=b.vx*dt;
  b.y+=b.vy*dt;

  if(!b.dead&&dist(b.x,b.y,p.x,p.y)<b.r+r){
   b.dead=true;
   burst(b.x,b.y,"#bd72ff");

   if(lives<MAX_LIVES){
    lives++;
    $("message").textContent=
     lives>=2?"EXTRA LIFE! You're blue — and bigger!":"EXTRA LIFE!";
   }else{
    // Award exactly 20 bonus points without changing the timer.
    score+=20;
    elapsed+=20;
    $("message").textContent="MAX LIVES! +20 POINTS";
   }
  }

  if(b.x<-40||b.x>W+40||b.y<-40||b.y>H+40)b.dead=true;
 });

 particles.forEach(pt=>{
  pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;
 });

 hazards=hazards.filter(b=>!b.dead);
 bonuses=bonuses.filter(b=>!b.dead);
 particles=particles.filter(pt=>pt.life>0);

 // A collision can end the game during this frame.
 if(!running){
  hud();draw();return;
 }

 hud();draw();
 rafId=requestAnimationFrame(loop);
}

draw();hud();
})();
</script>
</body>
</html>
